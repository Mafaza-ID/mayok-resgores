<style>
:root{--bg:#eafdff;--card:#fff;--tx:#475569;--soft:#eff6ff;--bd:#bfdbfe;--line:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b2d;--card:#1e293b;--tx:#cbd5e1;--soft:#162338;--bd:#334e7a;--line:#475569}}
:root[data-theme="dark"]{--bg:#0f1b2d;--card:#1e293b;--tx:#cbd5e1;--soft:#162338;--bd:#334e7a;--line:#475569}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;font-family:Nunito,system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
.scr{display:none;min-height:100vh;padding:70px 16px 24px;align-items:center;justify-content:center;flex-direction:column;position:relative}
.scr.on{display:flex}
#top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:8px;z-index:20}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:0 2px 8px #0002;display:grid;place-items:center;cursor:pointer;font-weight:900;color:var(--tx);font-size:13px}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#bm{color:#10b981}#bn{color:#f59e0b}#bs{color:#ec4899}
.off{opacity:.45}
.btn{border:0;border-radius:999px;font-weight:900;color:#fff;cursor:pointer;font-size:clamp(20px,4vw,30px);padding:18px 40px;background:#00d48f;box-shadow:0 8px 0 #00855c;display:inline-flex;gap:12px;align-items:center;justify-content:center}
.btn:active{transform:translateY(4px);box-shadow:0 4px 0 #00855c}
.btn.w{background:var(--card);color:#4f2cf0;box-shadow:0 6px 0 #c7d2fe;font-size:20px;padding:16px 30px;border:3px solid #c7d2fe}
.back{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px}
/* home */
#home{flex-direction:row;flex-wrap:wrap;gap:40px 70px}
.ttl{font-size:clamp(44px,8vw,76px);font-weight:900;line-height:1;margin:0}
.ttl b{display:block;color:#f72585}.ttl i{display:block;font-style:normal;color:#2f80ff;position:relative}
.ttl i:after{content:"";display:block;height:10px;border-radius:9px;background:#fcd56b;margin-top:8px;transform:rotate(-1deg)}
.mascot{font-size:130px;animation:fl 3s ease-in-out infinite;display:block}
@keyframes fl{50%{transform:translateY(-12px) rotate(3deg)}}
.credit{width:min(92%,460px);background:var(--card);border-radius:24px;padding:16px;text-align:center;font-size:14px;box-shadow:0 2px 10px #0001}
.credit strong{display:block;color:#4f2cf0;font-size:20px;margin-top:6px}
.hc{display:flex;flex-direction:column;gap:16px;min-width:min(90vw,480px)}
/* mode */
.pill{background:var(--card);border:4px solid #fde68a;border-radius:999px;padding:10px 40px;font-size:34px;font-weight:900;color:#ff9500;transform:rotate(-2deg);margin-bottom:34px}
.modes{display:flex;flex-direction:column;gap:18px;width:min(100%,740px)}
.mode{border:0;border-radius:32px;color:#fff;padding:22px;display:flex;align-items:center;gap:20px;text-align:left;cursor:pointer;width:100%}
.mode h3{margin:0;font-size:28px;font-weight:900}.mode p{margin:2px 0 0;font-weight:700;font-size:16px;opacity:.95}
.mode .ic{width:68px;height:68px;border-radius:18px;background:#fff3;display:grid;place-items:center;flex:none}
.mode .ic span{width:38px;height:38px;background:#fff;display:block}
.mode .go{margin-left:auto;width:62px;height:62px;border-radius:50%;background:#fff3;display:grid;place-items:center;flex:none;font-size:26px}
.m1{background:#4f9fff;box-shadow:0 8px 0 #2563eb}.m2{background:#fb62b5;box-shadow:0 8px 0 #db2777}.m3{background:#00d492;box-shadow:0 8px 0 #059669}
/* modal */
.ov{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.ov.on{display:flex}
.md{background:var(--card);border:4px solid #fde68a;border-radius:32px;padding:26px 32px;width:min(100%,440px);text-align:center;box-shadow:0 20px 50px #0004}
.md h2{margin:0 0 14px;color:#ff9500;font-size:30px;font-weight:900}
.md p{font-weight:800;line-height:1.6;margin:14px 0 22px}.md em{font-style:normal;color:#e11d8f}
.md .btn{width:100%;font-size:24px;padding:14px}
.md input{width:100%;padding:12px 16px;border-radius:16px;border:3px solid var(--bd);font-size:17px;font-weight:700;margin-bottom:10px;background:var(--soft);color:var(--tx)}
.dem{width:190px;height:190px;margin:auto;background:var(--soft);border:3px solid var(--line);border-radius:24px}
/* game */
#game{padding-top:14px}
.gt{width:min(100%,760px);display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:relative;z-index:2}
.gt .ib{position:static}
.lv{background:var(--card);border:3px solid #fde68a;border-radius:999px;padding:6px 22px;font-size:22px;font-weight:900;color:#ff9500}
.panel{width:min(100%,680px);background:var(--soft);border:4px solid var(--bd);border-radius:36px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.pl{background:var(--card);border-radius:999px;padding:8px 20px;font-weight:900;color:#2f6bff;font-size:18px;box-shadow:0 2px 6px #0001}
.bar{width:260px;height:7px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#f472b6;transition:width .2s}
.board{width:min(100%,440px);aspect-ratio:1;background:var(--card);border:8px solid var(--bd);border-radius:32px;margin:10px 0;touch-action:none}
.board svg{width:100%;height:100%;touch-action:none;display:block}
.hint{background:var(--card);border-radius:14px;padding:8px 16px;font-size:14px;font-weight:800;box-shadow:0 2px 6px #0001;text-align:center}
.nd{fill:#ffb800}.bl{animation:bk .8s infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bk{to{transform:scale(1.5);fill:#ff7a00}}
/* leaderboard */
.lb{width:min(100%,760px);background:var(--card);border-radius:32px;overflow:hidden;box-shadow:0 20px 50px #0002;min-height:620px}
.lh{background:linear-gradient(90deg,#5b5ffb,#9b13f5);color:#fff;padding:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lh h2{margin:0;font-size:28px;font-weight:900;flex:1;min-width:180px}
.lh button{border:0;border-radius:14px;padding:10px 14px;font-weight:800;color:#fff;background:#fff3;cursor:pointer}.lh .dl{background:#ec4899aa}
.lh .bk{background:none;font-size:28px;padding:0 6px}
.mem{padding:12px 24px;border-bottom:1px solid var(--line);font-size:13px;font-weight:800}.mem div{display:flex;justify-content:space-between}
.mb{height:7px;background:var(--line);border-radius:9px;margin-top:6px}.mb i{display:block;height:100%;background:#8b5cf6;border-radius:9px}
.rows{padding:12px 20px}.row{display:flex;gap:12px;align-items:center;padding:12px 10px;border-bottom:1px solid var(--line);font-weight:800}
.row b{width:34px;text-align:center;font-size:20px}.row span{flex:1}.row small{display:block;font-weight:700;opacity:.7}
.emp{text-align:center;padding:150px 20px;opacity:.7;font-weight:800}.emp h3{font-size:22px;margin:8px 0}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:14px;font-weight:800;display:none;z-index:40}
</style>
<style>
:root{--g:linear-gradient(160deg,#4f46e5,#a855f7 50%,#ff6fb5)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:linear-gradient(160deg,#1e1b4b,#4c1d95 55%,#831843)}}
:root[data-theme="dark"]{--g:linear-gradient(160deg,#1e1b4b,#4c1d95 55%,#831843)}
body{background:var(--g) fixed}
.scr{z-index:1}
#decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#decor span{position:absolute;font-size:44px;animation:fl 5s ease-in-out infinite;opacity:.85}
.ttl,.ttl *,.btn,.btn *,.pill,.mode h3,.lv,.md h2,.lh h2,.pl{font-family:"Lilita One",Nunito,system-ui,sans-serif!important;font-weight:400!important;letter-spacing:.5px}
#home{flex-direction:row;flex-wrap:wrap;gap:20px 40px;padding-top:40px}
.hero{height:min(72vh,540px);max-width:90vw;object-fit:contain;filter:drop-shadow(0 14px 18px #0005);animation:fl 3.4s ease-in-out infinite}
.hc{align-items:flex-start}
.ttl{font-size:clamp(52px,9vw,96px);-webkit-text-stroke:0;paint-order:stroke fill;text-shadow:0 5px 0 #1e3a8a,3px 3px 0 #1e3a8a,-3px 3px 0 #1e3a8a}
.ttl b{color:#ffe14d;-webkit-text-stroke:8px #1e3a8a}.ttl i{color:#fff;-webkit-text-stroke:8px #1e3a8a}
.ttl i:after{content:none}
.scribble{width:min(88vw,440px);margin:-4px 0 6px;overflow:visible}
.scribble path{fill:none;stroke-linecap:round;stroke-dasharray:520;stroke-dashoffset:520;animation:dr 1.4s .3s ease-out forwards}
.s1{stroke:#ffe14d;stroke-width:10}.s2{stroke:#4cc9f0;stroke-width:6;animation-delay:.9s!important}
@keyframes dr{to{stroke-dashoffset:0}}
.btn{border:4px solid #1e3a8a;background:linear-gradient(#4ade80,#16c060);box-shadow:0 8px 0 #1e3a8a;animation:bn 1.6s ease-in-out infinite}
.btn:active{box-shadow:0 3px 0 #1e3a8a}
.btn.w{background:linear-gradient(#ffd23f,#ff9f1c);color:#1e3a8a;border:4px solid #1e3a8a;box-shadow:0 8px 0 #1e3a8a;animation:none}
@keyframes bn{50%{transform:scale(1.04)}}
.credit{border:3px solid #1e3a8a;width:100%}.credit strong{color:#7c3aed}
.pill{background:#ffe14d;color:#1e3a8a;border:4px solid #1e3a8a;box-shadow:0 6px 0 #1e3a8a}
.mode{border:4px solid #1e3a8a}.m1{background:linear-gradient(#38bdf8,#2563eb);box-shadow:0 8px 0 #1e3a8a}.m2{background:linear-gradient(#ff7ac8,#ec1c8c);box-shadow:0 8px 0 #1e3a8a}.m3{background:linear-gradient(#4ade80,#0d9f5f);box-shadow:0 8px 0 #1e3a8a}
.mode:hover{transform:rotate(-1deg) scale(1.02)}
.mode h3{font-size:30px}
.md,.lv{border-color:#1e3a8a}.panel{border-color:#1e3a8a;background:var(--card)}
.board{border-color:#ffb703;background:var(--soft)}
.pl{color:#7c3aed;border:3px solid #1e3a8a}
.hint{border:3px solid #1e3a8a}
.lb{border:4px solid #1e3a8a}
@media(max-width:640px){#home{padding-top:60px}.hc{align-items:center}.ttl{text-align:center}}
</style>
<style>
:root:not(.a):not(.b):not(.c){--g:linear-gradient(180deg,#38bdf8 0%,#7dd3fc 38%,#fde68a 100%);--card:#fff;--tx:#334155;--soft:#e0f2fe;--bd:#7dd3fc;--line:#cbd5e1}
body{background:radial-gradient(#ffffff66 3px,transparent 4px) 0 0/42px 42px,var(--g) fixed}
.ttl b{color:#ff4d8d}.ttl i{color:#ffe14d}
.s1{stroke:#ff4d8d}.s2{stroke:#22d3ee}
.tag{margin:0 0 6px;font-weight:900;font-size:19px;color:#1e3a8a;background:#fffd;border:3px solid #1e3a8a;border-radius:18px;padding:8px 16px;max-width:440px}
.btn.w{background:linear-gradient(#ffe14d,#ffa41c)}
.pill{background:#fff;color:#ff4d8d}
.m1{background:linear-gradient(#38bdf8,#2563eb)}.m2{background:linear-gradient(#ff8fd0,#ff3d9a)}.m3{background:linear-gradient(#a3e635,#22c55e)}
.lh{background:linear-gradient(90deg,#38bdf8,#ff4d8d)}
</style>

const TX={id:{t1:"Mayok",t2:"Gores Gores",play:"AYO MAIN!",tag:"Gores semua koin tanpa putus! Seru, cerdas, dan bikin ketagihan 🎨",lb:"Papan Juara",by:"Dibuat oleh",pick:"Pilih Petualanganmu!",m1:"Misi Solo",m1d:"Jelajahi dunia sendirian, kumpulkan semua bintang!",m2:"Adu Jago",m2d:"Balapan 1 lawan 1! Siapa paling cepat, dia juara!",m3:"Tim Jagoan",m3d:"Main gantian 4 pemain, kompak jadi juara!",hint:"Gores dari koin yang berkedip!",how:"Cara Main",howp:"Gores garis lewat semua koin <em>tanpa putus</em> dan <em>jangan lewati garis yang sama!</em>",ready:"GASS!",mem:"Memori Lokal Terpakai",p:"Pemain",win:"Keren Banget!",dead:"Oops, buntu! Coba lagi…",next:"Lanjut",done:"Selesai",empty:"Belum ada juara",emptyd:"Main Adu Jago atau Tim Jagoan untuk jadi juara!",who:"Siapa yang main?",wins:"menang!",total:"Total waktu",all:"Semua level selesai! 🎉",csv:"CSV disalin ke clipboard",del:"Hapus semua data peringkat?"},
en:{t1:"Mayok",t2:"Gores Gores",play:"LET\u2019S PLAY!",tag:"Draw through every coin without lifting! Fun and brainy 🎨",lb:"Champions",by:"Created by",pick:"Pick Your Adventure!",m1:"Solo Mission",m1d:"Play relaxed alone, finish every level!",m2:"Hero Duel",m2d:"1 vs 1 race! Fastest wins!",m3:"Hero Team",m3d:"4 players take turns, teamwork!",hint:"Scribble from a blinking coin!",how:"How to Play",howp:"Draw a line connecting all dots <em>without lifting</em> and <em>never retrace the same line!</em>",ready:"GO!",mem:"Local Storage Used",p:"Player",win:"Awesome!",dead:"Dead end! Try again…",next:"Next",done:"Done",empty:"No leaderboard data yet",emptyd:"Play Duel or Squad mode to record scores!",who:"Who is playing?",wins:"wins!",total:"Total time",all:"All levels done! 🎉",csv:"CSV copied to clipboard",del:"Delete all leaderboard data?"}};
let lang=st.get("lang","id");const t=k=>TX[lang][k];
function applyLang(){$$("[data-i]").forEach(e=>e.innerHTML=t(e.dataset.i));$("#bl").textContent=lang.toUpperCase();document.documentElement.lang=lang;renderLB()}
$("#bl").onclick=()=>{lang=lang=="id"?"en":"id";st.set("lang",lang);applyLang()};

// levels: nodes [x,y], edges [a,b]
const pent=[[50,12],[88,40],[74,85],[26,85],[12,40]];
const LV=[
{n:[[50,18],[15,82],[85,82]],e:[[0,1],[1,2],[2,0]]},
{n:[[20,20],[80,20],[80,80],[20,80]],e:[[0,1],[1,2],[2,3],[3,0],[0,2]]},
{n:[[20,50],[80,50],[20,85],[80,85],[50,15]],e:[[0,1],[0,2],[1,3],[2,3],[0,4],[1,4]]},
{n:[[20,50],[80,50],[20,85],[80,85],[50,15]],e:[[0,1],[0,2],[1,3],[2,3],[0,4],[1,4],[0,3],[1,2]]},
{n:[[50,50],[15,20],[15,80],[85,20],[85,80]],e:[[0,1],[1,2],[2,0],[0,3],[3,4],[4,0]]},
{n:[[15,30],[50,30],[85,30],[15,70],[50,70],[85,70]],e:[[0,1],[1,2],[3,4],[4,5],[0,3],[1,4],[2,5]]},
{n:pent,e:[[0,2],[2,4],[4,1],[1,3],[3,0]]},
{n:pent,e:[[0,1],[1,2],[2,3],[3,4],[4,0],[0,2],[2,4],[4,1],[1,3],[3,0]]}
];
const ek=(a,b)=>a<b?a+"-"+b:b+"-"+a;
const PIC=["🐼","🦊","🐯","🐸"];
let G={mode:"solo",lv:0,names:[],pi:0,times:[],rl:[]},R={};

function show(id){$$(".scr").forEach(s=>s.classList.toggle("on",s.id==id));$("#bl").style.display=(id=="home"||id=="modes")?"":"none";if(id=="lbs")renderLB();window.scrollTo(0,0)}
$$("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
$("#play").onclick=()=>{show("modes");sfx(660);speak(lang=="id"?"Salam, Cong! Ayo pilih petualanganmu!":"Hello hero! Pick your adventure!")};$("#lbBtn").onclick=()=>show("lbs");$("#gb").onclick=()=>{stopT();show("modes")};

// audio
let AC,sndOn=true,musOn=true,mt,mi=0;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume()}catch(e){}return AC}
function tone(f,d=.12,v=.12,ty="sine"){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
function sfx(f,d,v){if(sndOn)tone(f,d,v,"triangle")}
/* Musik khas Madura: saronen + kendang + kenong/gong, tangga nada slendro */
const SL=k=>196*Math.pow(2,k*.2),NB=[];
const MEL=[5,6,5,3,5,3,2,3,0,2,3,2,0,-2,0,null,5,7,5,3,5,6,5,3,2,3,2,0,-2,0,2,0];
function sar(f,d){const a=ac();if(!a)return;const o=a.createOscillator(),v=a.createOscillator(),vg=a.createGain(),b=a.createBiquadFilter(),g=a.createGain(),n=a.currentTime;
 o.type="sawtooth";o.frequency.setValueAtTime(f*1.04,n);o.frequency.exponentialRampToValueAtTime(f,n+.05);v.frequency.value=6;vg.gain.value=f*.012;v.connect(vg);vg.connect(o.frequency);
 b.type="bandpass";b.frequency.value=1300;b.Q.value=2.5;g.gain.setValueAtTime(.001,n);g.gain.linearRampToValueAtTime(.07,n+.03);g.gain.exponentialRampToValueAtTime(.001,n+d);
 o.connect(b);b.connect(g);g.connect(a.destination);o.start(n);v.start(n);o.stop(n+d);v.stop(n+d)}
function kdp(hi){const a=ac();if(!a)return;const n=a.currentTime,g=a.createGain();g.connect(a.destination);
 if(!hi){const o=a.createOscillator();o.frequency.setValueAtTime(130,n);o.frequency.exponentialRampToValueAtTime(55,n+.2);g.gain.setValueAtTime(.3,n);g.gain.exponentialRampToValueAtTime(.001,n+.22);o.connect(g);o.start(n);o.stop(n+.25)}
 else{if(!NB.length){const bf=a.createBuffer(1,a.sampleRate*.06,a.sampleRate),d=bf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NB.push(bf)}
 const s=a.createBufferSource(),h=a.createBiquadFilter();s.buffer=NB[0];h.type="highpass";h.frequency.value=1800;g.gain.setValueAtTime(.1,n);g.gain.exponentialRampToValueAtTime(.001,n+.06);s.connect(h);h.connect(g);s.start(n)}}
function music(){clearInterval(mt);if(!musOn)return;mi=0;mt=setInterval(()=>{const s=mi++%32,m=MEL[s];
 if(m!==null)sar(SL(m),.34);if(s%4==0)kdp(0);if(s%4==2||s%8==7)kdp(1);if(s%4==0)tone(SL(m===null?0:m-10),.5,.04);if(s==0||s==16)tone(98,1.4,.09)},210)}
/* Narator */
let narOn=st.get("nar",true),vo;
function pickV(){try{const v=speechSynthesis.getVoices().filter(x=>/^id/i.test(x.lang));vo=v.find(x=>/male|andika|rizki|ardi|pria/i.test(x.name)&&!/female/i.test(x.name))||v.find(x=>!/damayanti|gadis|female|wanita/i.test(x.name))||v[0]}catch(e){}}
function speak(x){if(!narOn||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);u.lang=lang=="id"?"id-ID":"en-US";if(vo&&lang=="id")u.voice=vo;u.pitch=.65;u.rate=.92;speechSynthesis.speak(u)}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickV;pickV()}catch(e){}
if(!narOn)$("#bn").classList.add("off");
$("#bn").onclick=e=>{narOn=!narOn;st.set("nar",narOn);e.currentTarget.classList.toggle("off",!narOn);if(narOn)speak(lang=="id"?"Narator hidup, Cong!":"Narrator on!");else try{speechSynthesis.cancel()}catch(x){}};
$("#bs").onclick=e=>{sndOn=!sndOn;e.currentTarget.classList.toggle("off",!sndOn)};
$("#bm").onclick=e=>{musOn=!musOn;e.currentTarget.classList.toggle("off",!musOn);ac();music()};
document.addEventListener("pointerdown",()=>{if(!mt)music()},{once:true});
$("#bf").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2200)}

// modes
$$(".mode").forEach(b=>b.onclick=()=>{G.mode=b.dataset.m;const n=G.mode=="solo"?1:G.mode=="duel"?2:4;sfx(700);
 $("#sh").textContent=t("who");$("#si").innerHTML=Array.from({length:n},(_,i)=>`<input maxlength="14" placeholder="${t("p")} ${i+1}" value="">`).join("");$("#setup").classList.add("on")});
$("#sgo").onclick=()=>{G.names=$$("#si input").map((e,i)=>e.value.trim()||t("p")+(G.mode=="solo"?"":" "+(i+1)));$("#setup").classList.remove("on");
 G.pi=0;G.times=[];
 if(G.mode=="solo")G.lv=0;
 else if(G.mode=="duel"){G.rl=[2+Math.floor(Math.random()*6)]}
 else{G.rl=[1,3,5,7].map(x=>x)}
 if(st.get("seen",0))start();else{$("#how").classList.add("on");speak(lang=="id"?"Cara mainnya, Cong. Gores semua koin tanpa putus, dan jangan lewati garis yang sama ya.":"Draw through every coin without lifting, and never retrace a line.")}};
$("#ready").onclick=()=>{st.set("seen",1);$("#how").classList.remove("on");start()};

// game
let timer,t0=0;
function stopT(){clearInterval(timer);t0=0}
function curLevel(){return G.mode=="solo"?G.lv:G.mode=="duel"?G.rl[0]:G.rl[G.pi]}
function start(){show("game");const li=curLevel(),L=LV[li];
 $("#lv").textContent="Level "+(li+1);$("#pl").textContent=PIC[G.pi%4]+" "+G.names[G.pi];speak(lang=="id"?`Level ${li+1}. ${G.mode=="solo"?"":"Giliran "+G.names[G.pi]+". "}Gores dari koin yang berkedip, Cong!`:`Level ${li+1}. ${G.mode=="solo"?"":G.names[G.pi]+"'s turn. "}Start from the blinking coin!`);
 const deg=L.n.map(()=>0);L.e.forEach(([a,b])=>{deg[a]++;deg[b]++});
 const odd=deg.map((d,i)=>d%2?i:-1).filter(i=>i>=0);
 R={L,used:new Set(),path:[],cur:-1,starts:odd.length?odd:L.n.map((_,i)=>i),on:false,locked:false};
 stopT();$("#pb").style.width="0";draw()}
const RB=["#ff4d6d","#ff9f1c","#ffd60a","#2ec4b6","#4cc9f0","#b15cff"];
function draw(){const{L,used,path,cur,starts}=R;let h="";
 L.e.forEach(([a,b])=>h+=`<line x1="${L.n[a][0]}" y1="${L.n[a][1]}" x2="${L.n[b][0]}" y2="${L.n[b][1]}" stroke="var(--line)" stroke-width="3.6" stroke-linecap="round"/>`);
 L.e.forEach(([a,b])=>{if(used.has(ek(a,b)))h+=`<line x1="${L.n[a][0]}" y1="${L.n[a][1]}" x2="${L.n[b][0]}" y2="${L.n[b][1]}" stroke="${RB[(a*3+b)%6]}" stroke-width="4" stroke-linecap="round"/>`});
 h+=`<line id="tr" x1="0" y1="0" x2="0" y2="0" stroke="#f472b6" stroke-width="3.6" stroke-linecap="round" opacity="0"/>`;
 L.n.forEach(([x,y],i)=>{const bl=!path.length&&starts.includes(i);h+=`<circle stroke="#b45309" stroke-width="1.3" class="nd ${bl?"bl":""}" cx="${x}" cy="${y}" r="${i==cur?5.4:4.4}" ${i==cur?'fill="#f72585"':""}/>`});
 $("#sv").innerHTML=h;$("#pb").style.width=(used.size/L.e.length*100)+"%"}
const pt=e=>{const r=$("#sv").getBoundingClientRect();return[(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100]};
const near=(x,y,ex=-1)=>{let b=-1,bd=9;R.L.n.forEach(([nx,ny],i)=>{const d=Math.hypot(nx-x,ny-y);if(i!=ex&&d<bd){bd=d;b=i}});return b};
const sv=$("#sv");
sv.addEventListener("pointerdown",e=>{if(R.locked)return;const[x,y]=pt(e),n=near(x,y);if(n<0)return;
 if(!R.path.length){if(!R.starts.includes(n))return;R.path=[n];R.cur=n;if(!t0){t0=Date.now();timer=setInterval(()=>{$("#pl").textContent=PIC[G.pi%4]+" "+G.names[G.pi]+" · ⏱ "+((Date.now()-t0)/1000).toFixed(1)+"s"},100)}}
 else if(n!=R.cur)return;
 R.on=true;sv.setPointerCapture(e.pointerId);sfx(520);draw()});
sv.addEventListener("pointermove",e=>{if(!R.on)return;const[x,y]=pt(e),{L,cur}=R;
 const tr=$("#tr");if(tr){tr.setAttribute("x1",L.n[cur][0]);tr.setAttribute("y1",L.n[cur][1]);tr.setAttribute("x2",x);tr.setAttribute("y2",y);tr.setAttribute("opacity",1)}
 const n=near(x,y,cur);if(n<0)return;const k=ek(cur,n);
 if(L.e.some(([a,b])=>ek(a,b)==k)){
  if(!R.used.has(k)){R.used.add(k);R.path.push(n);R.cur=n;sfx(500+R.used.size*50);draw();check()}
  else if(R.path.length>1&&R.path[R.path.length-2]==n){R.used.delete(k);R.path.pop();R.cur=n;sfx(400);draw()}}});
const end=()=>{R.on=false;const tr=$("#tr");if(tr)tr.setAttribute("opacity",0)};
sv.addEventListener("pointerup",end);sv.addEventListener("pointercancel",end);
$("#rs").onclick=()=>{if(R.L){R.used=new Set();R.path=[];R.cur=-1;R.locked=false;draw()}};
function check(){const{L,used,cur}=R;
 if(used.size==L.e.length){R.locked=true;R.on=false;const tm=t0?(Date.now()-t0)/1000:0;stopT();win(tm);return}
 if(!L.e.some(([a,b])=>(a==cur||b==cur)&&!used.has(ek(a,b)))){R.locked=true;R.on=false;toast(t("dead"));sfx(200,.4,.2);speak(lang=="id"?"Oalah, buntu. Coba lagi, Cong!":"Dead end! Try again!");setTimeout(()=>$("#rs").onclick(),900)}}
function modal(h,p,b,f){speak(G.mode=="solo"?(lang=="id"?"Mantap, Cong! Bagus sekali!":"Awesome job!"):h.replace(/[^\p{L}\p{N} ]/gu,"")+(lang=="id"?". Mantap, Cong!":"!"));$("#rh").textContent=h;$("#rp").innerHTML=p;$("#rb").textContent=b;$("#rb").onclick=()=>{$("#res").classList.remove("on");f()};$("#res").classList.add("on")}
function win(tm){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>sfx(f,.25,.15),i*110));
 const ts=tm.toFixed(1)+"s";
 if(G.mode=="solo"){const last=G.lv>=LV.length-1;
  modal("⭐ "+t("win"),`Level ${G.lv+1} · ${ts}`+(last?"<br>"+t("all"):""),last?t("done"):t("next"),()=>{if(last)show("modes");else{G.lv++;start()}});return}
 G.times.push(tm);
 if(G.mode=="duel"){
  if(G.pi==0){modal("🐼 "+G.names[0],ts,t("next"),()=>{G.pi=1;start()});return}
  const[a,b]=G.times,w=a<=b?0:1;save("Duel",G.names.join(" vs "),G.names[w],Math.min(a,b));
  modal("🏆 "+G.names[w]+" "+t("wins"),`${G.names[0]}: ${a.toFixed(1)}s<br>${G.names[1]}: ${b.toFixed(1)}s`,t("done"),()=>show("modes"));return}
 if(G.pi<3){modal(PIC[G.pi]+" "+G.names[G.pi],ts,t("next"),()=>{G.pi++;start()});return}
 const tot=G.times.reduce((x,y)=>x+y,0);save("Squad",G.names.join(", "),"",tot);
 modal("🏆 "+t("win"),`${t("total")}: ${tot.toFixed(1)}s`,t("done"),()=>show("modes"))}

// leaderboard
function save(mode,names,winner,time){const r=st.get("lb",[]);r.push({mode,names,winner,time:+time.toFixed(2),date:new Date().toISOString().slice(0,10)});st.set("lb",r)}
function renderLB(){const r=st.get("lb",[]).sort((a,b)=>a.time-b.time),el=$("#rows");if(!el)return;
 const kb=(JSON.stringify(r).length/1024);$("#memv").textContent=kb.toFixed(2)+" KB / 5000 KB";$("#memb").style.width=Math.min(100,kb/50)+"%";
 el.innerHTML=r.length?`<div class="rows">`+r.map((x,i)=>`<div class="row"><b>${["🥇","🥈","🥉"][i]||i+1}</b><span>${esc(x.winner||x.names)}<small>${x.mode} · ${esc(x.names)} · ${x.date}</small></span><span style="flex:none;color:#7c3aed">${x.time}s</span></div>`).join("")+`</div>`
 :`<div class="emp"><div style="font-size:70px">🏅</div><h3>${t("empty")}</h3><div>${t("emptyd")}</div></div>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("#clr").onclick=()=>{if(confirm(t("del"))){st.set("lb",[]);renderLB()}};
$("#csv").onclick=()=>{const r=st.get("lb",[]);const c="mode,names,winner,time,date\n"+r.map(x=>[x.mode,x.names,x.winner,x.time,x.date].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
 try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="peringkat.csv";a.click()}catch(e){}
 try{navigator.clipboard.writeText(c);toast(t("csv"))}catch(e){}};
applyLang();
</script>
